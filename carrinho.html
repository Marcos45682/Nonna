<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu pedido · Nonna Trattoria</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="carrinho">
<div id="topo"></div>
<main>
<div class="titulo"><h1>Finalizar pedido</h1></div>
<div class="duas">
  <form id="formPedido">
    <div class="campos">
      <label class="campo larga" for="endereco">Endereço de entrega<input id="endereco" type="text" maxlength="80" minlength="8" required placeholder="Rua, número, complemento"></label>
      <label class="campo larga" for="telefone">Telefone<input id="telefone" type="text" inputmode="numeric" maxlength="15" required pattern="\(\d{2}\) \d{5}-\d{4}" data-mascara="tel" placeholder="(00) 00000-0000"></label>
    </div>
    <fieldset style="border:0;margin-top:18px"><legend style="font-weight:700;font-size:.9rem">Pagamento</legend>
      <label class="opcao"><input type="radio" name="pagamento" value="Pix" checked> Pix</label>
      <label class="opcao"><input type="radio" name="pagamento" value="Cartão de crédito"> Cartão de crédito</label>
      <label class="opcao"><input type="radio" name="pagamento" value="Dinheiro na entrega"> Dinheiro na entrega</label>
    </fieldset>
    <p class="erro" id="erroPedido" role="alert"></p>
    <button class="btn verm" type="submit" style="width:100%;margin-top:8px">Confirmar pedido</button>
  </form>
  <aside class="caixa"><h2>Seu pedido</h2><div id="resumo"></div></aside>
</div>
</main>
<div id="rodape"></div>
<script src="js/app.js"></script>
</body>
</html>
